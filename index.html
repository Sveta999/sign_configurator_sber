*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:'SB Sans Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:-80px;pointer-events:none;filter:blur(40px);
  background:
    radial-gradient(ellipse 24% 42% at 58% 52%, #00f0da 0%, #00e2cb 32%, rgba(0,175,155,.6) 60%, rgba(0,110,95,0) 86%),
    radial-gradient(ellipse 34% 28% at 56% 78%, rgba(130,235,205,.8) 0%, rgba(95,195,165,.4) 50%, rgba(60,140,120,0) 85%),
    radial-gradient(ellipse 80% 48% at 30% 112%, #e2efd9 0%, #bfe2cc 30%, rgba(115,195,165,.7) 52%, rgba(40,120,100,0) 80%),
    radial-gradient(ellipse 50% 72% at 44% 62%, rgba(0,0,0,0) 56%, rgba(0,35,28,.7) 68%, rgba(0,0,0,0) 82%),
    radial-gradient(ellipse 70% 80% at 92% 25%, rgba(0,72,58,.9) 0%, rgba(0,50,40,.5) 45%, rgba(0,30,22,0) 75%),
    radial-gradient(ellipse 60% 60% at 10% 78%, rgba(0,80,62,.8) 0%, rgba(0,60,48,0) 70%),
    linear-gradient(165deg, #000c08 0%, #011a13 35%, #022a21 70%, #04382c 100%)}
.page{position:relative;min-height:100vh;display:grid;grid-template-columns:1fr minmax(0,520px);gap:48px;align-items:center;padding:60px 70px 50px 62px}
.hero{align-self:start;margin-top:-.12em;font-size:clamp(56px,6.6vw,124px)}
.hero h1{font-size:clamp(56px,6.6vw,124px);line-height:.9;font-weight:600;letter-spacing:-.045em;margin:0}
.card{align-self:start;border-radius:28px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(160deg,rgba(22,24,26,.82),rgba(6,8,8,.9));box-shadow:0 30px 80px rgba(0,0,0,.5);padding:42px 36px 36px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h2{font-size:34px;font-weight:600;letter-spacing:-.01em;margin:0 0 22px}
.card .sub{font-size:14px;line-height:1.45;font-weight:500;color:rgba(255,255,255,.5);margin:0 0 50px;max-width:260px}
label{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.55);margin:0 0 10px}
input{display:block;width:100%;height:60px;border:0;border-radius:0;background:transparent;color:#fff;font:500 18px 'SB Sans Display',sans-serif;padding:0 0;margin:0 0 32px;outline:none;box-shadow:inset 0 -1px 0 rgba(255,255,255,.28)}
input:focus{box-shadow:inset 0 -2px 0 #21A038}
input:-webkit-autofill{-webkit-text-fill-color:#fff;caret-color:#fff;box-shadow:inset 0 -1px 0 rgba(255,255,255,.28);transition:background-color 9999s 0s} /* keep the browser's autofill colour away */
input:-webkit-autofill:focus{box-shadow:inset 0 -2px 0 #21A038}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:999px;font:600 15px 'SB Sans Display',sans-serif;cursor:pointer;text-decoration:none}
.btn.primary{height:64px;margin-top:82px;padding:0 22px;border:0;border-radius:16px;background:#fff;color:#000}
.btn.primary:disabled{opacity:.7;cursor:default}
.btn svg{display:block}
.err{margin:14px 0 0;color:#ff6b5e;font-size:13px;font-weight:500;text-align:center}
.err:empty{display:none}
@media (max-width:900px){
  .page{grid-template-columns:1fr;gap:36px;padding:40px 20px}
  .hero{padding-top:0}
  .hero h1{font-size:clamp(40px,11vw,80px)}
  .card{padding:32px 22px 24px}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="page">
  <section class="hero">
    <h1>конфигуратор<br>платёжной<br>страницы</h1>
  </section>
  <form class="card" id="gate" autocomplete="on">
    <h2>Войти</h2>
    <p class="sub">Используйте доступ, который выдал администратор.</p>
    <label for="login">Логин или почта</label>
    <input id="login" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn primary" id="go"><span id="goText">Войти</span><svg class="arr" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_SLOT = 'paypage-key-' + P.salt.slice(0, 8);
async function deriveKey(login, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(login.trim() + '\n' + password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openApp(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)); // throws on a wrong key
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try { sessionStorage.setItem(KEY_SLOT, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch (e) {}
  document.open(); document.write(html); document.close();
}
// already signed in in this tab: open without asking again
(async () => {
  let raw = null; try { raw = sessionStorage.getItem(KEY_SLOT); } catch (e) {}
  if (!raw) return;
  try { await openApp(await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', true, ['decrypt'])); }
  catch (e) { try { sessionStorage.removeItem(KEY_SLOT); } catch (_) {} }
})();
const form = document.getElementById('gate'), err = document.getElementById('err');
const go = document.getElementById('go'), goText = document.getElementById('goText');
form.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; goText.textContent = 'Проверяем…';
  try { await openApp(await deriveKey(form.login.value, form.password.value)); }
  catch (e2) { err.textContent = 'Неверный логин или пароль'; form.password.value = ''; form.password.focus(); go.disabled = false; goText.textContent = 'Войти'; }
});
</script>
